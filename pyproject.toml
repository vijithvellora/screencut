[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screencut-editor"
version = "0.2.0"
description = "A focused macOS screen recording editor"
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.7,<7"]

[project.optional-dependencies]
dev = ["ruff>=0.6"]
bundle = ["pyinstaller>=6"]

[project.scripts]
screencut = "editor:main"

[tool.setuptools]
py-modules = ["editor"]

[tool.setuptools.packages.find]
include = ["screencut*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
